name: VERIDIAN release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/veridian-release-once.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production database
        run: pnpm db:doctor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed catalogue and editorial content
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run complete release verification
        run: pnpm release:check

      - name: Smoke-test production
        run: pnpm smoke:production -- https://veridian-moto.vercel.app
